location ^~ /static/ {
    root /app/dist;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

location ^~ /public/website/ {
    root /data;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

location /public {
    root /data;
}

location /api {
    include api_proxy.conf;
}

location /admin {
    root /app/dist/admin;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files \$uri \$uri/ /index.html =404;
}

location /.well-known {
    alias /data/ssl/.well-known;
}

location / {
    root /app/dist;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files \$uri \$uri/ /index.html =404;
}
