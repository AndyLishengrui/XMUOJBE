location ^~ /static/ {
    root /app/dist;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

location ^~ /public/website/ {
    root /data;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

location /public {
    root /data;
}

location /coach/ {
    proxy_pass http://172.18.0.1:5000/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location /api {
    include api_proxy.conf;
}

# Notification management - serves Django page instead of Vue SPA
location /admin/notification {
    proxy_pass http://backend/api/admin/notification/manage/;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $http_host;
    client_max_body_size 200M;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
}

location /admin {
    root /app/dist/admin;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri $uri/ /index.html =404;
}

location /.well-known {
    alias /data/ssl/.well-known;
}

location /tc/ {
    proxy_set_header X-Script-Name /tc;
    proxy_pass http://textbook-dynamic:5001/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
}

location = /tc {
    return 301 /tc/;
}

# Password-protected video downloads
location ^~ /bonnke/ {
    auth_basic "Bonnke Videos - Please Login";
    auth_basic_user_file /etc/nginx/auth/bonnke.htpasswd;
    root /app/dist;
    autoindex on;
    charset utf-8;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location ^~ /AITeaching/ {
    root /app/dist;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri $uri/ /AITeaching/index.html =404;
}

