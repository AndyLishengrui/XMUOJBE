    server {
        listen 7777 default_server;
        server_name _;

        root /app/dist-staging;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;

        location ^~ /static/ {
            root /app/dist-staging;
            expires 5m;
            add_header Cache-Control "public, max-age=300, must-revalidate" always;
            access_log off;
        }

        location /public {
            root /data;
        }

        location /api {
            include api_proxy.conf;
        }

        # === 站内信 (Django 后端渲染) ===
        location = /admin/messages {
            proxy_pass http://backend/api/message/manage;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $http_host;
            client_max_body_size 200M;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
        }
        location = /admin/messages/ {
            proxy_pass http://backend/api/message/manage/;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $http_host;
            client_max_body_size 200M;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
        }

        # === 用户端站内信 (Django 后端渲染) ===
        location = /messages {
            proxy_pass http://backend/api/messages/inbox;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $http_host;
            client_max_body_size 200M;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
        }
        location = /messages/ {
            proxy_pass http://backend/api/messages/inbox/;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $http_host;
            client_max_body_size 200M;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
        }

        # === 通知管理 (Django 后端渲染 — 带查看/删除按钮的新页面) ===
        location = /admin/noteDetail {
            proxy_pass http://backend/api/notification/note-detail;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $http_host;
            client_max_body_size 200M;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
        }
        location = /admin/noteDetail/ {
            proxy_pass http://backend/api/notification/note-detail/;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $http_host;
            client_max_body_size 200M;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
        }

        # /admin/notification 由 Vue SPA 处理（旧通知管理页面）
        location /admin {
            root /app/dist-staging/admin;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            try_files $uri $uri/ /index.html =404;
        }

        location /coach/ {
            proxy_pass http://172.18.0.1:5000/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            root /app/dist-staging;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            try_files $uri $uri/ /index.html =404;
        }
    }